<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reporte CAT · Era Social</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#f4f6f5; --surface:#fff; --surface-2:#eaefec; --ink:#122420; --muted:#5c6b66; --line:#dbe3df;
    --accent:#1c9a80; --accent-deep:#0f6d5f; --accent-mint:#5cc1a0; --accent-ink:#eafaf5;
    --ok:#2e7d5b; --ok-bg:#e4f3ea;
    --warn:#a8720b; --warn-bg:#faefd9;
    --crit:#b8433a; --crit-bg:#fbe6e3;
    --shadow: 0 1px 2px rgba(15,40,34,.06), 0 6px 20px -8px rgba(15,40,34,.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1615; --surface:#171f1d; --surface-2:#1c2523; --ink:#e8f1ee; --muted:#8fa39c; --line:#28332f;
      --accent:#4fc3a4; --accent-deep:#2a9179; --accent-mint:#7cd8b8; --accent-ink:#0c231d;
      --ok:#5cbf8c; --ok-bg:#173226; --warn:#e0ac4f; --warn-bg:#3a2c0f; --crit:#e4776c; --crit-bg:#3a1c19;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -10px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1615; --surface:#171f1d; --surface-2:#1c2523; --ink:#e8f1ee; --muted:#8fa39c; --line:#28332f;
    --accent:#4fc3a4; --accent-deep:#2a9179; --accent-mint:#7cd8b8; --accent-ink:#0c231d;
    --ok:#5cbf8c; --ok-bg:#173226; --warn:#e0ac4f; --warn-bg:#3a2c0f; --crit:#e4776c; --crit-bg:#3a1c19;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -10px rgba(0,0,0,.55);
  }

  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; }
  h1,h2,h3{ font-family:'Libre Franklin', ui-sans-serif, system-ui, sans-serif; text-wrap:balance; letter-spacing:-0.01em; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  .shell{ max-width:1120px; margin:0 auto; padding:0 20px 64px; }

  .brandbar{ height:6px; background:linear-gradient(90deg, var(--accent-deep), var(--accent), var(--accent-mint)); }

  header.top{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; padding:26px 0 18px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand .logo-chip{ background:#fff; border-radius:12px; padding:8px 12px; box-shadow:var(--shadow); flex:none; }
  .brand .logo-chip img{ display:block; height:34px; width:auto; }
  .brand h1{ font-size:19px; font-weight:800; margin:0; line-height:1.1; }
  .brand .sub{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .asof{ text-align:right; font-size:12.5px; color:var(--muted); }
  .asof b{ color:var(--ink); font-weight:600; }

  nav.tabs{ display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:10px; margin-bottom:20px; overflow-x:auto; }
  nav.tabs button{ appearance:none; border:0; background:transparent; color:var(--muted); font:inherit; font-weight:600;
    font-size:13px; padding:8px 14px; border-radius:7px; cursor:pointer; white-space:nowrap; }
  nav.tabs button.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }

  .alert{ display:flex; align-items:center; gap:14px; border-radius:12px; padding:14px 18px; margin-bottom:22px; border:1px solid var(--line); }
  .alert.has-issues{ background:var(--crit-bg); border-color:transparent; }
  .alert.clear{ background:var(--ok-bg); border-color:transparent; }
  .alert .icon{ font-size:20px; flex:none; }
  .alert .txt b{ font-weight:700; }
  .alert.has-issues .txt, .alert.has-issues b{ color:var(--crit); }
  .alert.clear .txt, .alert.clear b{ color:var(--ok); }
  .alert-list{ margin-top:8px; display:flex; flex-direction:column; gap:6px; }
  .alert-list .item{ font-size:12.5px; color:var(--ink); background:var(--surface); border-radius:8px; padding:7px 10px; display:flex; gap:8px; align-items:center; }

  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px; }
  .stat{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:15px 16px; box-shadow:var(--shadow); }
  .stat .n{ font-family:'IBM Plex Mono'; font-size:26px; font-weight:600; line-height:1; }
  .stat .l{ font-size:12px; color:var(--muted); margin-top:6px; text-transform:uppercase; letter-spacing:.04em; }
  .stat.ok .n{ color:var(--ok); }
  .stat.warn .n{ color:var(--warn); }
  .stat.crit .n{ color:var(--crit); }

  .row2{ display:grid; grid-template-columns:1.3fr 1fr; gap:14px; margin-bottom:14px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; box-shadow:var(--shadow); }
  .card h3{ font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 14px; font-weight:600; }

  .chart{ display:flex; align-items:flex-end; gap:10px; height:120px; padding-top:6px; }
  .chart .col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0; }
  .chart .barwrap{ width:100%; height:88px; display:flex; align-items:flex-end; justify-content:center; }
  .chart .bar{ width:60%; min-width:14px; border-radius:5px 5px 2px 2px; background:linear-gradient(180deg, var(--accent-mint), var(--accent-deep)); position:relative; }
  .chart .bar .val{ position:absolute; top:-18px; left:50%; transform:translateX(-50%); font-family:'IBM Plex Mono'; font-size:11px; color:var(--muted); }
  .chart .lbl{ font-size:11px; color:var(--muted); white-space:nowrap; }
  .chart-empty{ color:var(--muted); font-size:13px; padding:20px 0; text-align:center; }

  .breakdowns{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:26px; }
  .bcard{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; box-shadow:var(--shadow); }
  .bcard h3{ font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 12px; font-weight:600; }
  .brow{ display:flex; align-items:center; gap:10px; font-size:13.5px; padding:6px 0; border-bottom:1px solid var(--line); }
  .brow:last-child{ border-bottom:0; }
  .brow .name{ flex:1; }
  .brow .bar{ height:6px; border-radius:3px; background:linear-gradient(90deg, var(--accent-deep), var(--accent-mint)); flex:none; }
  .brow .val{ font-family:'IBM Plex Mono'; font-size:13px; color:var(--muted); width:20px; text-align:right; }
  .empty-note{ font-size:12.5px; color:var(--muted); }

  h2.section{ font-size:15px; margin:0 0 12px; display:flex; align-items:center; justify-content:space-between; }
  h2.section .count{ font-size:12px; font-weight:500; color:var(--muted); text-transform:none; letter-spacing:0; }

  .table-wrap{ overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }
  table{ width:100%; border-collapse:collapse; min-width:960px; }
  thead th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  tbody td{ padding:12px 14px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:top; }
  tbody tr:last-child td{ border-bottom:0; }
  tbody tr:hover{ background:var(--surface-2); }
  td.time{ font-family:'IBM Plex Mono'; color:var(--muted); white-space:nowrap; }
  td.notes{ max-width:240px; color:var(--muted); font-size:12.5px; }
  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }
  .pill.ok{ background:var(--ok-bg); color:var(--ok); }
  .pill.warn{ background:var(--warn-bg); color:var(--warn); }
  .pill.crit{ background:var(--crit-bg); color:var(--crit); }
  .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
  .dir{ font-size:12px; color:var(--muted); }
  .empty-row td{ text-align:center; color:var(--muted); padding:30px 14px; }

  footer.note{ margin-top:20px; font-size:12px; color:var(--muted); text-align:center; }

  @media (max-width:820px){
    .stats{ grid-template-columns:1fr 1fr; }
    .breakdowns{ grid-template-columns:1fr; }
    .row2{ grid-template-columns:1fr; }
  }
</style>
</head>

  }

  function filtered(){
    return activeTab === 'Todas' ? CALLS : CALLS.filter(c => c.campana.trim() === activeTab);
  }

  function renderAlert(rows){
    const issues = rows.filter(c => c.estatus === 'Pendiente' || c.estatus.startsWith('Escalad'));
    const box = document.getElementById('alert-box');
    if (!issues.length){
      box.className = 'alert clear';
      box.innerHTML = `<span class="icon">✓</span><span class="txt">Sin llamadas <b>pendientes</b> ni <b>escaladas</b> en este momento.</span>`;
      return;
    }
    box.className = 'alert has-issues';
    box.innerHTML = `<div style="width:100%;"><div style="display:flex;align-items:center;gap:14px;"><span class="icon">⚠</span>
      <span class="txt"><b>${issues.length}</b> llamada${issues.length===1?'':'s'} necesita${issues.length===1?'':'n'} seguimiento</span></div>
      <div class="alert-list">${issues.map(c => `<div class="item"><span class="pill ${STATUS_PILL[c.estatus]||'warn'}"><span class="dot"></span>${escapeHtml(c.estatus)}</span> ${escapeHtml(c.agente)} — ${escapeHtml(c.quien)} · ${escapeHtml(c.motivo)}</div>`).join('')}</div></div>`;
  }

  function renderStats(rows){
    const completadas = rows.filter(c => c.estatus === 'Completado' || c.estatus === 'Resuelta').length;
    const pendientes = rows.filter(c => c.estatus === 'Pendiente').length;
    const escaladas = rows.filter(c => c.estatus.startsWith('Escalad')).length;
    document.getElementById('stats-row').innerHTML = `
      <div class="stat"><div class="n mono">${rows.length}</div><div class="l">Llamadas</div></div>
      <div class="stat ok"><div class="n mono">${completadas}</div><div class="l">Completadas</div></div>
      <div class="stat warn"><div class="n mono">${pendientes}</div><div class="l">Pendientes</div></div>
      <div class="stat crit"><div class="n mono">${escaladas}</div><div class="l">Escaladas</div></div>
    `;
  }

  function renderChart(rows){
    const byDay = {};
    rows.forEach(c => { byDay[c.fecha] = (byDay[c.fecha]||0) + 1; });
    const days = Object.keys(byDay).sort((a,b) => {
      const [da,ma,ya] = a.split('/').map(Number), [db,mb,yb] = b.split('/').map(Number);
      return new Date(ya,ma-1,da) - new Date(yb,mb-1,db);
    });
    const el = document.getElementById('chart');
    if (!days.length){ el.innerHTML = '<div class="chart-empty">Sin llamadas para este filtro.</div>'; return; }
    if (days.length < 3){
      el.innerHTML = `<div class="chart" style="height:auto;">${days.map(d => `
        <div class="col" style="flex:none; width:70px;">
          <div class="barwrap"><div class="bar" style="height:${Math.max(24, byDay[d]*22)}px;"><span class="val">${byDay[d]}</span></div></div>
          <div class="lbl">${d}</div>
        </div>`).join('')}</div>
        <div class="chart-empty" style="padding-top:14px;">Se necesita más historial para ver una tendencia clara.</div>`;
      return;
    }
    const max = Math.max(...days.map(d => byDay[d]));
    el.innerHTML = `<div class="chart">${days.map(d => `
      <div class="col">
        <div class="barwrap"><div class="bar" style="height:${Math.max(6, (byDay[d]/max)*88)}px;"><span class="val">${byDay[d]}</span></div></div>
        <div class="lbl">${d}</div>
      </div>`).join('')}</div>`;
  }

  function renderTopMotivos(rows){
    const counts = {};
    rows.forEach(c => { counts[c.motivo] = (counts[c.motivo]||0) + 1; });
    const top = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0,5);
    const el = document.getElementById('top-motivos');
    if (!top.length){ el.innerHTML = '<div class="empty-note">Sin datos para este filtro.</div>'; return; }
    const max = top[0][1];
    el.innerHTML = top.map(([name,n]) => `
      <div class="brow"><span class="name">${escapeHtml(name)}</span><span class="bar" style="width:${Math.max(16,(n/max)*120)}px;"></span><span class="val">${n}</span></div>
    `).join('');
  }

  function renderBreakdowns(rows){
    const agentes = {}; rows.forEach(c => agentes[c.agente.trim()] = (agentes[c.agente.trim()]||0)+1);
    const tipos = {}; rows.forEach(c => tipos[c.tipo] = (tipos[c.tipo]||0)+1);
    const camps = {}; rows.forEach(c => camps[c.campana.trim()] = (camps[c.campana.trim()]||0)+1);

    function barsFor(obj){
      const entries = Object.entries(obj).sort((a,b) => b[1]-a[1]);
      const max = entries.length ? entries[0][1] : 1;
      return entries.map(([name,n]) => `<div class="brow"><span class="name">${escapeHtml(name)}</span><span class="bar" style="width:${Math.max(16,(n/max)*120)}px;"></span><span class="val">${n}</span></div>`).join('') || '<div class="empty-note">Sin datos.</div>';
    }

    document.getElementById('breakdowns').innerHTML = `
      <div class="bcard"><h3>Por agente</h3>${barsFor(agentes)}</div>
      <div class="bcard"><h3>Por campaña</h3>${barsFor(camps)}</div>
      <div class="bcard"><h3>Entrante / Saliente</h3>${barsFor(tipos)}</div>
    `;
  }

  function renderTable(rows){
    document.getElementById('table-count').textContent = rows.length + (rows.length===1 ? ' llamada' : ' llamadas');
    const body = document.getElementById('calls-body');
    if (!rows.length){ body.innerHTML = '<tr class="empty-row"><td colspan="11">Sin llamadas para este filtro.</td></tr>'; return; }
    const sorted = rows.slice().sort((a,b) => (b.ts||'').localeCompare(a.ts||''));
    body.innerHTML = sorted.map(c => `
      <tr>
        <td class="time">${escapeHtml(c.hora)}</td>
        <td>${escapeHtml(c.agente)}</td>
        <td>${escapeHtml(c.campana)}</td>
        <td class="mono">${escapeHtml(c.membresia)}</td>
        <td>${escapeHtml(c.quien)}</td>
        <td class="mono">${escapeHtml(c.telefono)}</td>
        <td><span class="dir">${escapeHtml(c.tipo)}</span></td>
        <td>${escapeHtml(c.motivo)}</td>
        <td><span class="pill ${PRIORITY_PILL[c.prioridad]||'ok'}"><span class="dot"></span>${escapeHtml(c.prioridad)}</span></td>
        <td><span class="pill ${STATUS_PILL[c.estatus]||'warn'}"><span class="dot"></span>${escapeHtml(c.estatus)}</span></td>
        <td class="notes">${escapeHtml(c.notas)}</td>
      </tr>
    `).join('');
  }

  function renderAll(){
    renderTabs();
    const rows = filtered();
    renderAlert(rows);
    renderStats(rows);
    renderChart(rows);
    renderTopMotivos(rows);
    renderBreakdowns(rows);
    renderTable(rows);
  }

  document.getElementById('asof-time').textContent = '4 sep 2026, 13:38 (hora CDMX)';
  renderAll();
</script>
</body>
</html>
